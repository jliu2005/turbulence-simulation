# Git hooks for repository hygiene.
#
#   python -m pip install -r requirements-dev.txt
#   pre-commit install            # once per clone
#   pre-commit run --all-files    # check everything now
#
# Why these two matter for this project specifically: the demo notebook once
# accumulated ~23 MB of embedded base64 animation output in a single cell, and
# a saved DNS field reached 118 MB - past GitHub's 100 MB per-file hard limit,
# which makes the push fail outright. These hooks stop both from coming back.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.2
    hooks:
      - id: nbstripout
        files: \.ipynb$
        args:
          # Strip all cell outputs and execution counts (the default), but keep
          # per-cell tags so papermill/jupyter-book metadata survives.
          - --extra-key
          - metadata.tags

exclude: |
  (?x)^(
      figures/.*|
      requirements-lock\.txt
  )$
